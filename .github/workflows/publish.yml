name: Publish

# Stages the maintainer-approved package contents on npm through trusted publishing
# (OIDC). GPU testing happens locally; this workflow only rebuilds, compares and stages.
# Staged versions stay private until the maintainer approves them with 2FA.
# See RELEASING.md, "Hosted staging with provenance".
on:
  workflow_dispatch:
    inputs:
      mode:
        description: dry-run packs and compares only; stage also stages on npm
        type: choice
        options: [dry-run, stage]
        default: dry-run
      commit:
        description: Approved release commit (full SHA)
        type: string
        required: true
      approved:
        description: Approval JSON printed by `node scripts/release-ci.mjs approval` (required to stage)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  LEFTHOOK: '0'

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODE: ${{ inputs.mode }}
      COMMIT: ${{ inputs.commit }}
      APPROVED: ${{ inputs.approved }}
    steps:
      - name: Check inputs
        run: |
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'commit must be a full SHA'; exit 1; }
          if [ "$MODE" = stage ]; then
            [ "$GITHUB_REF" = refs/heads/main ] || { echo 'stage runs only from main'; exit 1; }
            [ -n "$APPROVED" ] || { echo 'stage needs the approval JSON'; exit 1; }
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
          fetch-depth: 0
      - name: Check the commit is on main
        if: inputs.mode == 'stage'
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$COMMIT" origin/main
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      # No dependency cache: release bytes come only from the lockfile.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/release-ci.mjs pack release-artifacts
      - name: Compare with the approved contents
        if: inputs.approved != ''
        run: node scripts/release-ci.mjs verify release-artifacts "$APPROVED"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifacts
          path: release-artifacts
          retention-days: 7

  stage:
    needs: pack
    if: inputs.mode == 'stage'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      APPROVED: ${{ inputs.approved }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-artifacts
          path: release-artifacts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      # Staged publishing needs npm 11.15 or later; trusted publishing needs 11.5.1.
      - run: npm install --global npm@11.21.2
      - name: Recheck the contents to stage
        run: node scripts/release-ci.mjs verify release-artifacts "$APPROVED"
      - name: Stage on npm (provenance from trusted publishing)
        # The tag is the version's prerelease name (beta for 1.0.0-beta.0), never latest.
        run: |
          node -e "for (const a of require('./release-artifacts/packed.json')) console.log(a.file, a.tag)" |
            while read -r file tag; do
              [ "$tag" != latest ] || { echo "$file: stable versions need a separate decision"; exit 1; }
              npm stage publish "./release-artifacts/$file" --tag "$tag" --access public
            done

name: Set up verification
description: Install the pinned toolchain and dependencies
inputs:
  browser:
    description: Install Chromium and Linux software GPU prerequisites
    default: 'false'
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - if: inputs.browser == 'true'
      run: |
        pnpm --filter @domfx/lab exec playwright install --with-deps chromium
        sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
      shell: bash

pre-commit:
  parallel: true
  commands:
    format:
      run: pnpm format:check
    lint:
      run: pnpm lint

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit "{1}"

pre-push:
  commands:
    check:
      run: |
        if [ "${DOMFX_FULL_VERIFY:-0}" = 1 ]; then
          pnpm agent:verify
        else
          pnpm check && pnpm build:demo:built
        fi

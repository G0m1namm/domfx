<symbol id="obj-open" viewBox="0 0 400 400"><g transform="translate(200 190)"><g mask="url(#ms-open-0)"><rect x="-220" y="-220" width="440" height="440" fill="url(#g6-foil)" filter="url(#f6-foil)"/><rect x="-220" y="-220" width="440" height="440" fill="url(#g7-ramp)" filter="url(#f7-heat)"/><g filter="url(#f7-roll)"><g mask="url(#md-open-0)"><rect x="-220" y="-220" width="440" height="440" fill="#000" opacity=".34"/></g></g><g transform="translate(0 0) rotate(-18)"><use href="#sf-open-0" fill="none" stroke="#000" stroke-opacity=".12" stroke-width="14.00" filter="url(#f7-roll)"/><use href="#sf-open-0" fill="none" stroke="url(#g7-rim)" stroke-width="12.00" filter="url(#f7-sheen)"/></g><g mask="url(#md-open-0)"><g transform="translate(0 0) rotate(-18)"><use href="#sf-open-0" y="24" fill="none" stroke="#fff" stroke-opacity=".26" stroke-width="8.00" filter="url(#f7-sheen)"/></g></g><rect x="-220" y="-220" width="440" height="440" filter="url(#f6-grain)" style="mix-blend-mode:overlay" opacity=".36"/></g></g></symbol>

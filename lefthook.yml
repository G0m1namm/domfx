pre-commit:
  parallel: true
  commands:
    format:
      run: pnpm format:check
    lint:
      run: pnpm lint
    artifacts:
      run: pnpm check:artifacts

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit "{1}"

pre-push:
  commands:
    check:
      run: |
        if [ "${DOMFX_FULL_VERIFY:-0}" = 1 ]; then
          pnpm agent:verify && pnpm test:gpu:full
        else
          pnpm check && pnpm build:web:built
        fi

name: Check

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LEFTHOOK: '0'

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
      - name: Check pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      - name: Check latest pushed commit
        if: github.event_name == 'push'
        run: git log -1 --format=%B | pnpm exec commitlint
      - run: pnpm check
      - name: Site discovery (indexing on, preview override and default off)
        run: pnpm test:discovery:built
      - name: Configure browser dependency mirrors
        run: |
          # Azure's archive can transfer slowly enough to exhaust the job budget.
          printf '%s\tpriority:%s\n' \
            'https://archive.ubuntu.com/ubuntu/' 1 \
            'http://azure.archive.ubuntu.com/ubuntu/' 2 \
            'https://security.ubuntu.com/ubuntu/' 3 \
            | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          printf '%s\n' \
            'Acquire::Retries "1";' \
            'Acquire::http::Timeout "15";' \
            'Acquire::https::Timeout "15";' \
            | sudo tee /etc/apt/apt.conf.d/zzz-domfx-ci > /dev/null
          apt-config shell RETRIES Acquire::Retries \
            HTTP_TIMEOUT Acquire::http::Timeout HTTPS_TIMEOUT Acquire::https::Timeout
      - name: Install Chromium and system dependencies
        timeout-minutes: 5
        run: pnpm --filter @domfx/web exec playwright install --with-deps chromium
      - name: Website smoke and routine regressions (no GPU required)
        run: pnpm test:web:smoke:built
      - name: Docs smoke (no GPU required)
        run: pnpm test:docs:smoke:built
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: website-smoke
          path: .scratch/web/
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: docs-smoke
          path: .scratch/docs/report.json
          include-hidden-files: true
          retention-days: 7
      - name: Pull request release preflight
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm release:preflight:built --base "$BASE_SHA"
      - if: github.event_name != 'pull_request'
        run: pnpm release:status --since origin/main
      - if: github.event_name != 'pull_request'
        run: pnpm release:artifacts

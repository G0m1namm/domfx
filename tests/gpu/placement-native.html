<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Native placement verification</title>
  </head>
  <body>
    <h1>Native placement verification</h1>
    <p>Set native browser zoom, then run. Keep this window visible until the result appears.</p>
    <label><input id="visual-check" type="checkbox" /> Confirm painted output visually</label>
    <button id="run" type="button">Run placement checks</button>
    <button id="confirm-paint" type="button" hidden>All three effects are visible</button>
    <output id="status" role="status">Ready</output>
    <div id="fixture"></div>
    <pre id="report"></pre>
    <script type="module" src="/src/placement-native.ts"></script>
  </body>
</html>

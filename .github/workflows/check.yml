name: Check

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LEFTHOOK: '0'
      DOMFX_GPU_BACKEND: swiftshader
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
      - name: Check pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      - name: Check latest pushed commit
        if: github.event_name == 'push'
        run: git log -1 --format=%B | pnpm exec commitlint
      - name: Install browser and software GPU prerequisites
        run: |
          pnpm --filter @domfx/lab exec playwright install --with-deps chromium
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
      - run: pnpm agent:verify
      - name: Verify Astro website
        run: pnpm test:web
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-gpu-evidence
          path: |
            .scratch/agent/
            .scratch/web/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - run: pnpm release:status --since origin/main
      - run: pnpm release:artifacts
